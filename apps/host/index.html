<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vue 3 + Vite 7 micro-frontend host" />
    <!-- %VITE_APP_TITLE% is replaced by Vite at build/dev time (HTML env replacement) -->
    <title>%VITE_APP_TITLE%</title>

    <!--
      Critical CSS lives inline in index.html.
      It paints the page background and a loading splash BEFORE any JS/CSS bundle
      has downloaded, so there is no white flash while the host and remotes boot.
      Everything else is written in Sass (src/styles + <style lang="scss">).
    -->
    <style>
      :root {
        --mfe-bg: #f4f6fb;
        --mfe-fg: #1f2937;
        --mfe-brand: #42b883;
        --mfe-brand-dark: #35495e;
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--mfe-bg);
        color: var(--mfe-fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Splash shown until Vue mounts and replaces #app's content */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 12px;
        align-content: center;
        background: var(--mfe-bg);
      }
      .boot-splash__spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid #d8dee9;
        border-top-color: var(--mfe-brand);
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-splash__text {
        font-size: 14px;
        color: var(--mfe-brand-dark);
        letter-spacing: 0.04em;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash__spinner"></div>
        <div class="boot-splash__text">Loading host…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
