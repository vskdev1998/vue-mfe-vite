<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE% (standalone)</title>
    <!--
      Only used when shell-b runs standalone (http://localhost:5002).
      Inline critical CSS: background + boot message before JS loads.
    -->
    <style>
      :root {
        --shell-b-accent: #0d9488;
      }
      html,
      body {
        margin: 0;
        background: #ecfdf5;
        color: #134e4a;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .standalone-banner {
        padding: 8px 16px;
        background: var(--shell-b-accent);
        color: #fff;
        font-size: 13px;
        text-align: center;
      }
      /* Standalone-only layout. Kept here (not in a .scss imported by main.js)
         because bundleAllCSS would otherwise ship it to the host too. */
      #app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      #app:empty::before {
        content: 'Loading shell-b…';
        display: block;
        padding: 48px;
        text-align: center;
        color: var(--shell-b-accent);
      }
    </style>
  </head>
  <body>
    <div class="standalone-banner">Shell B running standalone · port 5002 · <a href="%VITE_HOST_URL%" style="color:#fff">open the host</a></div>
    <div id="app"></div>
    <script type="module" src="/src/main.mjs"></script>
  </body>
</html>
