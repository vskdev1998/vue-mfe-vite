<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE% (standalone)</title>
    <!--
      index.html is ONLY used when shell-a runs standalone (npm run dev -w @mfe/shell-a
      and open http://localhost:8081). When the host consumes shell-a it loads
      remoteEntry.js instead, so nothing in this file leaks into the host.

      Inline critical CSS: page background + boot splash before JS arrives.
    -->
    <style>
      :root {
        --shell-a-accent: #6366f1;
      }
      html,
      body {
        margin: 0;
        background: #eef0ff;
        color: #1e1b4b;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .standalone-banner {
        padding: 8px 16px;
        background: var(--shell-a-accent);
        color: #fff;
        font-size: 13px;
        text-align: center;
      }
      /* Standalone-only layout. Kept here (not in a .scss imported by main.js)
         because bundleAllCSS would otherwise ship it to the host too. */
      #app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      #app:empty::before {
        content: 'Loading shell-a…';
        display: block;
        padding: 48px;
        text-align: center;
        color: var(--shell-a-accent);
      }
    </style>
  </head>
  <body>
    <div class="standalone-banner">Shell A running standalone · port 8081 · <a href="%VITE_HOST_URL%" style="color:#fff">open the host</a></div>
    <div id="app"></div>
    <script type="module" src="/src/main.mjs"></script>
  </body>
</html>
