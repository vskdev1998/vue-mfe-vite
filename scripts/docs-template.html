<!--PAGES-->

  </div>

<script>
(() => {
  const INDEX = /*INDEX*/null;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const pages = INDEX.map((p) => p.id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  /* theme */
  const savedTheme = store.get('docs-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('.theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('docs-theme', next);
  });

  /* mobile nav */
  const menuBtn = $('.menu-btn');
  const setNav = (open) => { document.body.classList.toggle('nav-open', open); menuBtn.setAttribute('aria-expanded', open); };
  menuBtn.addEventListener('click', () => setNav(!document.body.classList.contains('nav-open')));
  $('.scrim').addEventListener('click', () => setNav(false));

  /* routing: #/page or #/page/anchor */
  let observer;
  function route() {
    const [, pageId = 'overview', anchor] = location.hash.match(/^#\/([^/]+)(?:\/(.+))?/) || [];
    const id = pages.includes(pageId) ? pageId : 'overview';
    $$('.doc').forEach((el) => (el.hidden = el.dataset.page !== id));
    $$('.nav__link').forEach((a) => a.classList.toggle('is-active', a.dataset.page === id));
    const meta = INDEX.find((p) => p.id === id);
    document.title = `${meta.title} · vue-mfe-vite docs`;
    buildToc(meta);
    buildPager(id);
    setNav(false);
    const target = anchor && document.getElementById(`${id}--${decodeURIComponent(anchor)}`);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  function buildToc(meta) {
    const toc = $('#toc');
    toc.innerHTML = meta.toc.map((t) => `<a class="lvl-${t.depth}" href="#/${meta.id}/${t.anchor.slice(meta.id.length + 2)}" data-anchor="${t.anchor}">${t.text}</a>`).join('');
    observer?.disconnect();
    const links = new Map($$('a', toc).map((a) => [a.dataset.anchor, a]));
    observer = new IntersectionObserver((entries) => {
      const visible = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!visible) return;
      links.forEach((a) => a.classList.remove('is-active'));
      links.get(visible.target.id)?.classList.add('is-active');
    }, { rootMargin: '-70px 0px -70% 0px' });
    meta.toc.forEach((t) => { const h = document.getElementById(t.anchor); if (h) observer.observe(h); });
  }

  function buildPager(id) {
    const i = pages.indexOf(id);
    const prev = INDEX[i - 1], next = INDEX[i + 1];
    $('.pager').innerHTML =
      (prev ? `<a href="#/${prev.id}"><small>Previous</small>${prev.title}</a>` : '') +
      (next ? `<a class="next" href="#/${next.id}"><small>Next</small>${next.title}</a>` : '');
  }

  /* copy buttons */
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.code__copy');
    if (!btn) return;
    const text = btn.closest('.code').querySelector('code').innerText;
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
    catch { btn.textContent = 'Select & copy'; }
    setTimeout(() => (btn.textContent = 'Copy'), 1400);
  });

  /* search across page titles, headings and text */
  const q = $('#q'), results = $('#results');
  function search(term) {
    term = term.trim().toLowerCase();
    if (!term) { results.hidden = true; results.innerHTML = ''; return; }
    const hits = [];
    for (const p of INDEX) {
      if (p.title.toLowerCase().includes(term)) hits.push({ href: `#/${p.id}`, title: p.title, sub: 'Page', score: 3 });
      for (const t of p.toc) if (t.text.toLowerCase().includes(term))
        hits.push({ href: `#/${p.id}/${t.anchor.slice(p.id.length + 2)}`, title: t.text, sub: p.title, score: 2 });
      const at = p.text.toLowerCase().indexOf(term);
      if (at > -1 && !hits.some((h) => h.sub === p.title || h.title === p.title))
        hits.push({ href: `#/${p.id}`, title: p.title, sub: '…' + p.text.slice(Math.max(0, at - 30), at + 50).trim() + '…', score: 1 });
    }
    hits.sort((a, b) => b.score - a.score);
    results.hidden = false;
    results.innerHTML = hits.length
      ? hits.slice(0, 12).map((h, i) => `<li><a href="${h.href}" class="${i === 0 ? 'is-active' : ''}">${h.title}<small>${h.sub.replace(/</g, '&lt;')}</small></a></li>`).join('')
      : '<li class="results__empty">No matches</li>';
  }
  q.addEventListener('input', () => search(q.value));
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const a = $('a', results); if (a) { location.hash = a.getAttribute('href'); q.value = ''; search(''); } }
    if (e.key === 'Escape') { q.value = ''; search(''); q.blur(); }
  });
  results.addEventListener('click', () => { q.value = ''; search(''); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q && !e.metaKey && !e.ctrlKey) { e.preventDefault(); if (innerWidth <= 860) setNav(true); q.focus(); }
  });

  addEventListener('hashchange', route);
  route();
})();
</script>
